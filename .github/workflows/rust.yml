name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check formatting
      run: cargo fmt --check
    - name: Run clippy
      run: cargo clippy -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Check all example sources
      run: |
        while IFS= read -r -d '' file; do
          cargo run -- check "$file"
        done < <(find examples -name '*.gp' -not -path '*/.goplusgen/*' -print0)
    - name: Build example packages
      run: |
        cargo run -- build examples/link-source/main.gp --out-dir .goplusgen --out ./goplus-link-source
        cargo run -- build examples/complex-app/main.gp --out-dir .goplusgen --out ./goplus-complex-app
