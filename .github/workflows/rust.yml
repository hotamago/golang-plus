name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Check formatting
      run: cargo fmt --check
    - name: Run clippy
      run: cargo clippy -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Check examples
      run: |
        cargo run -- check examples/demo.gp
        cargo run -- check examples/link-source/main.gp
    - name: Build mixed-source example
      run: cargo run -- build examples/link-source/main.gp --out-dir .goplusgen --out ./goplus-link-source
