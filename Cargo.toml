[package]
name = "goplus"
version = "0.2.1"
edition = "2024"
description = "GoPlus: A modern, powerful language toolchain"
license = "MIT"
repository = "https://github.com/hotamago/golang-plus"
authors = ["GoPlus Contributors"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.39", features = ["derive"] }
logos = "0.15.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"

[dev-dependencies]
criterion = "0.5.1"
tempfile = "3.20.0"

[[bench]]
name = "pipeline"
harness = false
